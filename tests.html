<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Automated Test Runner</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .test-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1rem;
    }
    .test-summary-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      margin-top: 0.75rem;
    }
    .badge-pass {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--accent-lime);
      border: 1px solid var(--accent-lime);
    }
    .badge-fail {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .test-suite {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .suite-title {
      background-color: var(--bg-card-elevated);
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
    }
    .test-case {
      padding: 0.65rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .test-case:last-child {
      border-bottom: none;
    }
    .test-status {
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
    }
    .status-ok {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-lime);
    }
    .status-err {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .test-error-msg {
      color: #f87171;
      font-family: monospace;
      font-size: 0.8rem;
      margin-top: 0.35rem;
    }
    .test-runner-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="test-header">
    <h1>FitTrack Automated Verification Suite</h1>
    <p class="text-secondary">Testing Mifflin-St Jeor BMR/TDEE calculations, Epley 1RM formula, streak boundary rules, PR persistence, JSON/CSV exports, and data migrations.</p>
    <div id="test-summary">
      <div class="test-summary-badge badge-pass" id="summary-pill">
        Running tests...
      </div>
    </div>
  </div>

  <div class="test-runner-actions">
    <button type="button" class="btn btn-primary" onclick="runAllTests()">▶ Re-run All Tests</button>
    <a href="index.html" class="btn btn-outline">← Back to FitTrack App</a>
  </div>

  <div id="test-results-container"></div>

  <!-- Include App Logic -->
  <script src="app.js"></script>
  <script>
    'use strict';

    // Simple test harness
    const suites = [];
    let currentSuite = null;

    function describe(suiteName, fn) {
      currentSuite = { name: suiteName, tests: [] };
      suites.push(currentSuite);
      fn();
    }

    function it(testName, fn) {
      currentSuite.tests.push({ name: testName, fn });
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || 'Assertion failed');
      }
    }

    function assertEquals(actual, expected, message) {
      if (actual !== expected) {
        throw new Error((message ? message + ': ' : '') + `Expected [${expected}] but got [${actual}]`);
      }
    }

    // ==========================================
    // TEST SUITES
    // ==========================================

    describe('1. Energy Expenditure & Target Calculations (Mifflin-St Jeor)', () => {
      it('calculates BMR correctly for Male (75kg, 169cm, 24yo)', () => {
        // 10*75 + 6.25*169 - 5*24 + 5 = 750 + 1056.25 - 120 + 5 = 1691.25 -> 1691
        const bmr = FitTrackCalc.calculateBMR(75, 169, 24, 'male');
        assertEquals(bmr, 1691, 'Male BMR should match Mifflin-St Jeor formula');
      });

      it('calculates BMR correctly for Female (60kg, 165cm, 25yo)', () => {
        // 10*60 + 6.25*165 - 5*25 - 161 = 600 + 1031.25 - 125 - 161 = 1345.25 -> 1345
        const bmr = FitTrackCalc.calculateBMR(60, 165, 25, 'female');
        assertEquals(bmr, 1345, 'Female BMR should match Mifflin-St Jeor formula');
      });

      it('calculates TDEE using activity multiplier', () => {
        const bmr = 1691;
        const tdee = FitTrackCalc.calculateTDEE(bmr, 1.6);
        assertEquals(tdee, 2706, 'TDEE should multiply BMR by 1.6');
      });

      it('recommends evidence-informed targets for fat loss with muscle retention', () => {
        const profile = { weight: 75, height: 169, age: 24, sex: 'male', activityLevel: '1.6', goal: 'fat_loss' };
        const targets = FitTrackCalc.calculateTargets(profile);

        assert(targets.targetCalories >= 2200 && targets.targetCalories <= 2400, `Calories should be in moderate deficit: ${targets.targetCalories}`);
        assertEquals(targets.proteinGrams, 150, 'Recommended protein at 2.0g/kg for 75kg should be 150g');
        assertEquals(targets.proteinRangeMin, 120, 'Min protein (1.6g/kg) should be 120g');
        assertEquals(targets.proteinRangeMax, 165, 'Max protein (2.2g/kg) should be 165g');
        assert(targets.deficitKcal >= 300 && targets.deficitKcal <= 500, 'Deficit should be moderate (300-500 kcal)');
      });

      it('enforces safe dieting calorie floor', () => {
        const lowProfile = { weight: 45, height: 150, age: 30, sex: 'female', activityLevel: '1.2', goal: 'fat_loss' };
        const targets = FitTrackCalc.calculateTargets(lowProfile);
        assert(targets.targetCalories >= 1500, 'Calorie target must never be dangerously low');
      });
    });

    describe('2. Strength Calculations & Epley 1RM Formula', () => {
      it('calculates actual 1RM when reps === 1', () => {
        const res = FitTrackCalc.calculate1RM(100, 1);
        assertEquals(res.estimated1RM, 100);
        assertEquals(res.isActual1RM, true, 'Reps === 1 should be flagged as Actual 1RM');
      });

      it('calculates estimated 1RM using Epley: W * (1 + R / 30)', () => {
        // 80 * (1 + 10 / 30) = 80 * 1.3333 = 106.7
        const res = FitTrackCalc.calculate1RM(80, 10);
        assertEquals(res.estimated1RM, 106.7);
        assertEquals(res.isActual1RM, false, 'Reps > 1 should be flagged as estimated');
      });

      it('handles zero or invalid numbers gracefully', () => {
        const res = FitTrackCalc.calculate1RM(0, 5);
        assertEquals(res.estimated1RM, 0);
        assertEquals(res.isActual1RM, false);
      });
    });

    describe('3. Streak Mechanics & Calendar Boundaries', () => {
      it('counts streak as 0 when no logs exist', () => {
        const res = FitTrackCalc.calculateStreaks([]);
        assertEquals(res.currentStreak, 0);
        assertEquals(res.longestStreak, 0);
        assertEquals(res.todayCompleted, false);
      });

      it('increments streak for consecutive completed days', () => {
        const logs = [
          { date: '2026-10-26', completed: true },
          { date: '2026-10-27', completed: true },
          { date: '2026-10-28', completed: true }
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-10-28');
        assertEquals(res.currentStreak, 3);
        assertEquals(res.longestStreak, 3);
        assertEquals(res.todayCompleted, true);
      });

      it('allows streak to remain active today if yesterday was completed', () => {
        const logs = [
          { date: '2026-10-26', completed: true },
          { date: '2026-10-27', completed: true }
          // 2026-10-28 is today and not yet completed
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-10-28');
        assertEquals(res.currentStreak, 2, 'Active streak should carry over yesterday so user can log today');
        assertEquals(res.todayCompleted, false);
      });

      it('breaks streak when a day is missing', () => {
        const logs = [
          { date: '2026-10-25', completed: true },
          // 2026-10-26 missing
          { date: '2026-10-27', completed: true },
          { date: '2026-10-28', completed: true }
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-10-28');
        assertEquals(res.currentStreak, 2, 'Current streak should only count consecutive run from Oct 27');
        assertEquals(res.longestStreak, 2);
      });

      it('counts rest days as completed when marked completed', () => {
        const logs = [
          { date: '2026-10-27', completed: true, workoutStatus: 'workout' },
          { date: '2026-10-28', completed: true, workoutStatus: 'rest' } // Rest day saved!
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-10-28');
        assertEquals(res.currentStreak, 2, 'Rest days must count toward streak if log is saved');
      });

      it('handles month and year boundaries correctly', () => {
        const logs = [
          { date: '2025-12-31', completed: true },
          { date: '2026-01-01', completed: true },
          { date: '2026-01-02', completed: true }
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-01-02');
        assertEquals(res.currentStreak, 3, 'Consecutive days across year boundary must increment streak');
      });

      it('tracks longest streak even after a break occurs', () => {
        const logs = [
          // 5-day streak
          { date: '2026-01-01', completed: true },
          { date: '2026-01-02', completed: true },
          { date: '2026-01-03', completed: true },
          { date: '2026-01-04', completed: true },
          { date: '2026-01-05', completed: true },
          // Gap
          // New 2-day streak
          { date: '2026-01-10', completed: true },
          { date: '2026-01-11', completed: true }
        ];
        const res = FitTrackCalc.calculateStreaks(logs, '2026-01-11');
        assertEquals(res.currentStreak, 2);
        assertEquals(res.longestStreak, 5, 'Longest historical streak should be 5');
      });
    });

    describe('4. PR Engine & Performance Preservation', () => {
      it('records new PR and updates exercisePRs accurately', () => {
        const store = new FitTrackStore();
        store.data.workouts = [];
        store.data.exercisePRs = {};

        const workout1 = {
          id: 'w-test-1',
          date: '2026-10-20',
          name: 'Chest Day',
          exercises: [
            {
              name: 'Barbell Bench Press',
              muscleGroup: 'Chest',
              isPrimary: true,
              sets: [{ weight: 80, reps: 5 }] // Est 1RM: 80 * (1 + 5/30) = 93.3
            }
          ]
        };

        store.saveWorkout(workout1);
        const pr = store.data.exercisePRs['barbell bench press'];
        assert(pr !== undefined, 'PR record should be created');
        assertEquals(pr.bestWeight, 80);
        assertEquals(pr.bestEst1RM, 93.3);
      });

      it('strictly preserves historical PR when a later session lifts lighter', () => {
        const store = new FitTrackStore();
        store.data.workouts = [];
        store.data.exercisePRs = {};

        // Day 1: Heavy PR
        store.saveWorkout({
          id: 'w-heavy',
          date: '2026-10-20',
          name: 'Heavy Day',
          exercises: [{ name: 'Squat', muscleGroup: 'Legs', isPrimary: true, sets: [{ weight: 120, reps: 5 }] }] // 1RM ~140
        });

        // Day 2: Light recovery session
        store.saveWorkout({
          id: 'w-light',
          date: '2026-10-23',
          name: 'Light Day',
          exercises: [{ name: 'Squat', muscleGroup: 'Legs', isPrimary: true, sets: [{ weight: 90, reps: 5 }] }]
        });

        const pr = store.data.exercisePRs['squat'];
        assertEquals(pr.bestWeight, 120, 'Best weight must not be overwritten by lighter workout');
        assertEquals(pr.bestEst1RM, 140, 'Best est 1RM must remain from the heavy session');
      });
    });

    describe('5. Data Persistence, Duplicate Handling & Serialization', () => {
      it('prevents duplicate daily logs on the same date by updating', () => {
        const store = new FitTrackStore();
        store.data.dailyLogs = [];

        store.saveDailyLog({ date: '2026-10-28', calories: 2000, protein: 140, completed: true });
        assertEquals(store.data.dailyLogs.length, 1);

        // Save again for same date with updated calories
        store.saveDailyLog({ date: '2026-10-28', calories: 2150, protein: 155, completed: true });
        assertEquals(store.data.dailyLogs.length, 1, 'Should NOT create duplicate entry for same date');
        assertEquals(store.data.dailyLogs[0].calories, 2150);
        assertEquals(store.data.dailyLogs[0].protein, 155);
      });

      it('generates valid JSON export and re-imports successfully', () => {
        const store = new FitTrackStore();
        store.data.profile.weight = 74.5;
        const exported = store.exportJSON();
        assert(typeof exported === 'string', 'Export must return a string');
        
        const freshStore = new FitTrackStore();
        const importRes = freshStore.importJSON(exported);
        assertEquals(importRes.success, true);
        assertEquals(freshStore.data.profile.weight, 74.5);
      });

      it('generates valid CSV strings with correct headers', () => {
        const store = new FitTrackStore();
        store.data.measurements = [
          { date: '2026-10-28', weight: 74.8, bodyFat: 15.2, waist: 83.5, notes: 'Morning' }
        ];

        const csv = store.exportCSV('measurements');
        assert(csv.includes('Date,Weight (kg),Body Fat (%),Waist (cm)'), 'CSV must contain standard headers');
        assert(csv.includes('"2026-10-28"'), 'CSV must contain data row');
      });
    });

    describe('6. Nutrition Totals & Calculation Logic', () => {
      it('calculates daily totals accurately across multiple food items', () => {
        const store = new FitTrackStore();
        store.data.foodEntries = [
          { id: '1', date: '2026-10-28', calories: 330, protein: 62, carbs: 0, fat: 7 },
          { id: '2', date: '2026-10-28', calories: 120, protein: 25, carbs: 2, fat: 1 },
          { id: '3', date: '2026-10-27', calories: 500, protein: 30, carbs: 50, fat: 10 } // Different date
        ];

        const totals = store.getDailyNutritionTotals('2026-10-28');
        assertEquals(totals.calories, 450);
        assertEquals(totals.protein, 87);
        assertEquals(totals.carbs, 2);
        assertEquals(totals.fat, 8);
      });
    });

    describe('7. Client-Side Cryptographic Vault (AES-256-GCM + PBKDF2)', () => {
      it('initializes vault configuration and sets master passphrase', async () => {
        localStorage.removeItem(FitTrackVault.VAULT_CONFIG_KEY);
        const res = await FitTrackVault.setupMasterPassword('AdminSecret123');
        assertEquals(res.success, true);
        assertEquals(FitTrackVault.isVaultConfigured(), true);
        assertEquals(FitTrackVault.isUnlocked, true);
      });

      it('encrypts plaintext into ciphertext and decrypts accurately', async () => {
        const secretPayload = JSON.stringify({ weight: 75.2, notes: 'Private gym session' });
        const encrypted = await FitTrackVault.encrypt(secretPayload);
        assertEquals(encrypted.encrypted, true);
        assert(typeof encrypted.ciphertext === 'string' && encrypted.ciphertext.length > 0);

        const decrypted = await FitTrackVault.decrypt(encrypted);
        assertEquals(decrypted, secretPayload);
      });

      it('rejects incorrect master passphrase', async () => {
        const unlockRes = await FitTrackVault.unlock('WrongPassword!');
        assertEquals(unlockRes.success, false);
      });

      it('locks vault session and clears memory key', async () => {
        FitTrackVault.lock();
        assertEquals(FitTrackVault.isUnlocked, false);
        assertEquals(FitTrackVault.sessionKey, null);
      });

      it('unlocks vault with correct master passphrase', async () => {
        const unlockRes = await FitTrackVault.unlock('AdminSecret123');
        assertEquals(unlockRes.success, true);
        assertEquals(FitTrackVault.isUnlocked, true);
        assert(FitTrackVault.sessionKey !== null);
      });
    });

    describe('8. Authentication & Multi-User RBAC Engine (FitTrackAuth)', () => {
      it('creates initial administrator account with salted PBKDF2 hash', async () => {
        localStorage.removeItem(FitTrackAuth.USERS_STORAGE_KEY);
        sessionStorage.removeItem(FitTrackAuth.SESSION_STORAGE_KEY);
        
        const res = await FitTrackAuth.createAdminAccount('admin', 'SecurePass123!');
        assertEquals(res.success, true);
        assertEquals(FitTrackAuth.isAuthenticated(), true);
        assertEquals(FitTrackAuth.isAdmin(), true);
        assertEquals(FitTrackAuth.hasAdminUser(), true);
      });

      it('rejects invalid credentials during login', async () => {
        FitTrackAuth.logout();
        assertEquals(FitTrackAuth.isAuthenticated(), false);
        const loginFail = await FitTrackAuth.login('admin', 'WrongPass!');
        assertEquals(loginFail.success, false);
      });

      it('authenticates valid admin credentials and creates active session', async () => {
        const loginOk = await FitTrackAuth.login('admin', 'SecurePass123!');
        assertEquals(loginOk.success, true);
        assertEquals(FitTrackAuth.isAuthenticated(), true);
        assert(FitTrackAuth.getSession().token !== null);
      });

      it('allows administrator to provision a new user account', async () => {
        const newU = await FitTrackAuth.createUserByAdmin('client_mike', 'MemberPass456!', 'user');
        assertEquals(newU.success, true);
        assertEquals(newU.user.role, 'user');
        assertEquals(newU.user.username, 'client_mike');
      });

      it('prevents duplicate usernames', async () => {
        const dup = await FitTrackAuth.createUserByAdmin('client_mike', 'AnotherPass789!', 'user');
        assertEquals(dup.success, false);
      });

      it('prevents deleting the only primary administrator', async () => {
        const adminUser = FitTrackAuth.getUsers().find(u => u.role === 'admin');
        assert(adminUser !== undefined, 'Admin user should exist');
        const delRes = FitTrackAuth.deleteUserByAdmin(adminUser.id);
        assertEquals(delRes.success, false);
      });
    });

    describe('9. Motivational Progress & Goal Completion Tiers (FitTrackMotivation)', () => {
      it('returns 🌱 tier for 0–24% progress with seedling.gif', () => {
        const t = FitTrackMotivation.getTier(15);
        assertEquals(t.emoji, '🌱');
        assertEquals(t.gif, 'assets/gifs/seedling.gif');
        assertEquals(t.message, 'Every journey starts with a small step!');
      });

      it('returns 💪 tier for 25–49% progress with biceps.gif', () => {
        const t = FitTrackMotivation.getTier(35);
        assertEquals(t.emoji, '💪');
        assertEquals(t.gif, 'assets/gifs/biceps.gif');
        assertEquals(t.message, 'Good start! Keep going!');
      });

      it('returns 🔥 tier for 50–74% progress with fire.gif', () => {
        const t = FitTrackMotivation.getTier(60);
        assertEquals(t.emoji, '🔥');
        assertEquals(t.gif, 'assets/gifs/fire.gif');
        assertEquals(t.message, 'You’re making great progress!');
      });

      it('returns 🚀 tier for 75–99% progress with rocket.gif', () => {
        const t = FitTrackMotivation.getTier(88);
        assertEquals(t.emoji, '🚀');
        assertEquals(t.gif, 'assets/gifs/rocket.gif');
        assertEquals(t.message, 'Almost there! Keep pushing!');
      });

      it('returns 🏆 tier with 🎉 celebration and trophy.gif for 100%+ progress', () => {
        const t = FitTrackMotivation.getTier(100);
        assertEquals(t.emoji, '🏆');
        assertEquals(t.gif, 'assets/gifs/trophy.gif');
        assertEquals(t.celebration, '🎉');
        assertEquals(t.isComplete, true);
      });

      it('evaluates optimal calorie compliance (90–105%) as goal achieved', () => {
        const calOk = FitTrackMotivation.getCalorieTier(2150, 2200);
        assertEquals(calOk.emoji, '🏆');
        assertEquals(calOk.isComplete, true);
      });

      it('cautions on overeating (>105%) without encouraging excess eating', () => {
        const calOver = FitTrackMotivation.getCalorieTier(2500, 2200);
        assertEquals(calOver.emoji, '⚖️');
        assertEquals(calOver.isComplete, false);
      });
    });

    describe('10. Adaptive Nutrition Target Advisor (FitTrackAdaptive)', () => {
      it('calculates evidence-informed protein recommendation (2.0 g/kg for fat loss)', () => {
        const store = new FitTrackStore();
        store.data.profile.weight = 80;
        store.data.profile.goal = 'fat_loss';
        const evalRes = FitTrackAdaptive.evaluateTargets(store);
        assertEquals(evalRes.recommendedProtein, 160); // 80 * 2.0
      });

      it('detects weight plateau over rolling weeks and recommends gentle -100 kcal adjustment', () => {
        const store = new FitTrackStore();
        store.data.profile.weight = 80;
        store.data.goals.dailyCalories = 2200;
        store.data.dailyLogs = [
          { date: '2026-10-28', weight: 80.0 }, { date: '2026-10-27', weight: 80.0 }, { date: '2026-10-26', weight: 80.0 },
          { date: '2026-10-25', weight: 80.0 }, { date: '2026-10-24', weight: 80.0 }, { date: '2026-10-23', weight: 80.0 },
          { date: '2026-10-22', weight: 80.0 }, { date: '2026-10-21', weight: 80.0 }, { date: '2026-10-20', weight: 80.0 }
        ];
        const plateauEval = FitTrackAdaptive.evaluateTargets(store);
        assertEquals(plateauEval.recommendedCalories, 2100);
      });

      it('enforces 1500 kcal safe floor limit during calorie cuts', () => {
        const store = new FitTrackStore();
        store.data.profile.weight = 80;
        store.data.goals.dailyCalories = 1550;
        store.data.dailyLogs = [
          { date: '2026-10-28', weight: 80.0 }, { date: '2026-10-27', weight: 80.0 }, { date: '2026-10-26', weight: 80.0 },
          { date: '2026-10-25', weight: 80.0 }, { date: '2026-10-24', weight: 80.0 }, { date: '2026-10-23', weight: 80.0 },
          { date: '2026-10-22', weight: 80.0 }, { date: '2026-10-21', weight: 80.0 }, { date: '2026-10-20', weight: 80.0 }
        ];
        const floorEval = FitTrackAdaptive.evaluateTargets(store);
        assertEquals(floorEval.recommendedCalories, 1500);
      });
    });

    describe('FitTrackSmartMeal - Natural Language Meal AI Parser', () => {
      it('correctly parses user multi-item lunch example with quantities and units', () => {
        const text = `lunch\n\nrice - 100g\nchicken 200 gm\n2 boiled egg white\ngravy`;
        const res = FitTrackSmartMeal.parseMealText(text);
        assertEquals(res.category, 'lunch');
        assertEquals(res.items.length, 4);
        assertEquals(res.items[0].name, 'Cooked Rice');
        assertEquals(res.items[0].calories, 130);
        assertEquals(res.items[1].name, 'Chicken Breast (Cooked)');
        assertEquals(res.items[1].calories, 330);
        assertEquals(res.items[1].protein, 62);
        assertEquals(res.items[2].name, 'Boiled Egg White');
        assertEquals(res.items[2].calories, 34);
        assertEquals(res.items[2].protein, 7.2);
        assertEquals(res.items[3].name, 'Curry Gravy');
        assertEquals(res.items[3].calories, 120);
        assertEquals(res.totalCalories, 614);
        assertEquals(res.totalProtein, 74.4);
      });

      it('correctly parses breakfast items with pieces and slices', () => {
        const text = `breakfast: 3 whole eggs, 2 slices bread, 1 banana`;
        const res = FitTrackSmartMeal.parseMealText(text);
        assertEquals(res.category, 'breakfast');
        assertEquals(res.items.length, 3);
        assertEquals(res.items[0].calories, 222);
        assertEquals(res.items[0].protein, 18.9);
        assertEquals(res.items[1].calories, 150);
        assertEquals(res.items[2].calories, 105);
      });

      it('handles liquid ml units and protein scoops', () => {
        const text = `snack: 1 scoop whey protein, 250ml milk, 1 tbsp peanut butter`;
        const res = FitTrackSmartMeal.parseMealText(text);
        assertEquals(res.category, 'snack');
        assertEquals(res.items.length, 3);
        assertEquals(res.items[0].calories, 120);
        assertEquals(res.items[0].protein, 24);
        assertEquals(res.items[1].calories, 155);
        assertEquals(res.items[1].protein, 8);
        assertEquals(res.items[2].calories, 95);
      });

      it('correctly parses chicken burger as complete burger dish rather than plain chicken breast', () => {
        const text = 'chicken burger';
        const res = FitTrackSmartMeal.parseMealText(text);
        assertEquals(res.items.length, 1);
        assertEquals(res.items[0].name, 'Chicken Burger');

          goal: 'fat_loss',
          bodyFat: 22,
          targetBodyFat: 10
        });
        assertEquals(t2.bmr, 1699, 'Mifflin-St Jeor BMR for 75.8kg male is 1699 kcal');
        assertEquals(t2.tdee, 2718, 'TDEE at 1.6x is 2718 kcal');
        assertEquals(t2.deficitKcal, 489, '18% deficit is 489 kcal');
        assertEquals(t2.targetCalories, 2229, 'Target calories is 2229 kcal');
        assertEquals(t2.proteinGrams, 152, 'Protein target is 152g (2.0 g/kg)');
        assertEquals(t2.waterTarget, 2653, 'Water target is 75.8 * 35 = 2653 ml');
        assertEquals(t2.recomp.targetWeight, 65.7, 'Target weight at 10% BF is 65.7 kg');
        assertEquals(t2.recomp.fatMassToLose, 10.1, 'Fat to lose is 10.1 kg');
      });

      it('pre-seeds default administrator credentials and guarantees hasAdminUser is true on fresh sessions', () => {
        localStorage.removeItem('fittrack_users_v1');
        const users = FitTrackAuth.getUsers();
        assert(users.length >= 1, 'Default admin pre-seeded when localStorage is empty');
        assertEquals(users[0].username, 'admin', 'Default admin username is admin');
        assertEquals(users[0].role, 'admin', 'Default admin has administrator role');
        assert(FitTrackAuth.hasAdminUser(), 'hasAdminUser is always true');
      });

      it('enforces standard login card display and strictly conceals first-time setup from visitors', () => {
        const app = new FitTrackApp();
        localStorage.removeItem('fittrack_session_v1');
        app.renderLoginView();
        const stdCard = document.getElementById('card-standard-login');
        const setupCard = document.getElementById('card-first-time-setup');
        if (stdCard) assertEquals(stdCard.style.display, 'block', 'Standard login card is visible');
        if (setupCard) assertEquals(setupCard.style.display, 'none', 'First-time setup card is hidden');
      });

      it('morning weight calibration handles both empty trigger and custom weight input seamlessly', () => {
        const app = new FitTrackApp();
        app.store.data.profile.weight = 75.8;
        app.store.data.profile.goal = 'fat_loss';
        let input = document.getElementById('dash-morning-weight-input');
        if (!input) {
          input = document.createElement('input');
          input.id = 'dash-morning-weight-input';
          document.body.appendChild(input);
        }
        input.value = '';
        app.handleMorningWeightSubmit();
        assertEquals(app.store.data.profile.weight, 75.8, 'Calibrates with existing weight when input is blank');

        input.value = '75.5';
        app.handleMorningWeightSubmit();
        assertEquals(app.store.data.profile.weight, 75.5, 'Updates to 75.5 kg when custom weight is entered');
        const todayStr = FitTrackCalc.formatDateLocal();
        const todayLog = app.store.getDailyLog(todayStr);
        assertEquals(todayLog.weight, 75.5, 'Daily log weight updated to 75.5 kg');
      });

      it('unifies activity level and targets between evaluateTargets and calculateTargets', () => {
        const app = new FitTrackApp();
        app.store.data.measurements = [];
        app.store.data.profile = {
          weight: 75.8,
          height: 169,
          age: 24,
          sex: 'male',
          goal: 'fat_loss'
        };
        const baseline = FitTrackCalc.calculateTargets(app.store.data.profile);
        const evalResult = FitTrackAdaptive.evaluateTargets(app.store);
        assertEquals(baseline.targetCalories, evalResult.recommendedCalories, 'Target calories match between baseline and adaptive evaluation');
      });
    });

    // Run and render results sequentially in exact declaration order
    async function runAllTests() {
      const container = document.getElementById('test-results-container');
      container.innerHTML = '';
      let totalTests = 0;
      let passedTests = 0;
      let failedTests = 0;

      for (const suite of suites) {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'test-suite';

        let suiteHtml = `<div class="suite-title"><span>${suite.name}</span></div>`;

        for (let idx = 0; idx < suite.tests.length; idx++) {
          const t = suite.tests[idx];
          totalTests++;
          let statusHtml = '';

          try {
            await t.fn();
            passedTests++;
            statusHtml = `<span class="test-status status-ok">PASS ✓</span>`;
          } catch (err) {
            failedTests++;
            statusHtml = `
              <div>
                <span class="test-status status-err">FAIL ✕</span>
                <div class="test-error-msg">${err.message}</div>
              </div>
            `;
          }

          suiteHtml += `
            <div class="test-case">
              <span>${t.name}</span>
              <div>${statusHtml}</div>
            </div>
          `;
        }

        suiteEl.innerHTML = suiteHtml;
        container.appendChild(suiteEl);
      }

      const pill = document.getElementById('summary-pill');
      if (failedTests === 0) {
        pill.className = 'test-summary-badge badge-pass';
        pill.innerHTML = `✓ ALL ${passedTests} TESTS PASSED (0 Failures)`;
      } else {
        pill.className = 'test-summary-badge badge-fail';
        pill.innerHTML = `✕ ${failedTests} of ${totalTests} TESTS FAILED`;
      }
      window.__TEST_RESULTS__ = { total: totalTests, passed: passedTests, failed: failedTests, success: failedTests === 0 };
    }

    // Auto-run on load
    window.addEventListener('DOMContentLoaded', () => {
      runAllTests();
    });
  </script>
